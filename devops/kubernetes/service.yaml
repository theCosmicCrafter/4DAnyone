# Service is optional — 4DAnyone is primarily a batch inference tool.
# Use this if wrapping inference.py behind a REST API (e.g., FastAPI).
apiVersion: v1
kind: Service
metadata:
  name: fdanyone-service
  labels:
    app: fdanyone
    component: inference
spec:
  type: ClusterIP
  selector:
    app: fdanyone
    component: inference
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
